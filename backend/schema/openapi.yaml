  /api/v1/users/{id}/roles/:
    post:
      operationId: users_roles_create
      description: Replaces the roles of one account (RF-021).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleAssignment'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RoleAssignment'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RoleAssignment'
        required: true
      security:
      - cookieJWT: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
  /api/v1/users/export/:
    get:
      operationId: users_export_retrieve
      description: Every account matching the list filters as an .xlsx download, without
        pagination.
      parameters:
      - in: query
        name: is_active
        schema:
          type: boolean
      - in: query
        name: role
        schema:
          enum:
          - STUDENT
          - MONITOR
          - TEACHER
          - ADMIN
          type: string
          minLength: 1
        description: |-
          * `STUDENT` - Estudiante
          * `MONITOR` - Monitor
          * `TEACHER` - Docente
          * `ADMIN` - Administrador
      - in: query
        name: search
        schema:
          type: string
          maxLength: 254
        description: Busca en correo, nombres, apellidos y nombre completo.
      tags:
      - users
      security:
      - cookieJWT: []
      responses:
        '200':
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
          description: Excel workbook
  /api/v1/users/me/:
    get:
      operationId: users_me_retrieve
      description: The authenticated user's own identity and roles (CA-HU01-5).
      tags:
      - users
      security:
      - cookieJWT: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/users/summary/:
    get:
      operationId: users_summary_retrieve
      description: Headline numbers and the latest audit entries for the admin dashboard.
      tags:
      - users
      security:
      - cookieJWT: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummary'
          description: ''
components:
  schemas:
    AcademicTerm:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          description: Formato AAAA-S, por ejemplo 2026-1.
          maxLength: 6
        start_date:
          type: string
          format: date
          title: Fecha de inicio
        end_date:
          type: string
          format: date
          title: Fecha de fin
      required:
      - code
      - end_date
      - id
      - start_date
    ActionEnum:
      enum:
      - USER_CREATED
      - USER_UPDATED
      - USER_ACTIVATED
      - USER_DEACTIVATED
      - ROLES_CHANGED
      type: string
      description: |-
        * `USER_CREATED` - Usuario creado
        * `USER_UPDATED` - Usuario editado
        * `USER_ACTIVATED` - Usuario activado
        * `USER_DEACTIVATED` - Usuario desactivado
        * `ROLES_CHANGED` - Roles modificados
    AdminUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
          title: Correo
        first_name:
          type: string
          readOnly: true
          title: Nombre
        last_name:
          type: string
          readOnly: true
          title: Apellido
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RolesEnum'
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        date_joined:
          type: string
          format: date-time
          readOnly: true
      required:
      - date_joined
      - email
      - first_name
      - id
      - is_active
      - last_name
      - roles
    AssignedMonitor:
      type: object
      description: A monitor of one of the teacher's courses; `id` is the monitor's
        user id.
      properties:
        id:
          type: string
          format: uuid
        full_name:
          type: string
          readOnly: true
        email:
          type: string
          format: email
        committed_hours:
          type: integer
      required:
      - committed_hours
      - email
      - full_name
      - id
    AttendanceEnum:
      enum:
      - ATTENDED
      - NO_SHOW
      type: string
      description: |-
        * `ATTENDED` - ATTENDED
        * `NO_SHOW` - NO_SHOW
    AttendanceMark:
      type: object
      properties:
        reservation_id:
          type: string
          format: uuid
        attendance:
          $ref: '#/components/schemas/AttendanceEnum'
      required:
      - attendance
      - reservation_id
    AttendanceRow:
      type: object
      properties:
        reservation_id:
          type: string
          format: uuid
          readOnly: true
        student:
          allOf:
          - $ref: '#/components/schemas/MonitorReference'
          readOnly: true
        attendance:
          allOf:
          - $ref: '#/components/schemas/AttendanceEnum'
          readOnly: true
      required:
      - attendance
      - reservation_id
      - student
    AuditEntry:
      type: object
      properties:
        id:
          type: integer
        action:
          $ref: '#/components/schemas/ActionEnum'
        created_at:
          type: string
          format: date-time
        actor:
          allOf:
          - $ref: '#/components/schemas/UserReference'
          nullable: true
        target:
          allOf:
          - $ref: '#/components/schemas/UserReference'
          nullable: true
      required:
      - action
      - actor
      - created_at
      - id
      - target
    AvailabilitySlot:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        subject:
          allOf:
          - $ref: '#/components/schemas/SubjectReference'
          readOnly: true
        monitor:
          allOf:
          - $ref: '#/components/schemas/MonitorReference'
          readOnly: true
        term:
          type: string
          title: Código
          readOnly: true
        template:
          type: integer
          readOnly: true
          nullable: true
        starts_at:
          type: string
          format: date-time
          readOnly: true
          title: Inicio
        ends_at:
          type: string
          format: date-time
          readOnly: true
          title: Fin
        capacity:
          type: integer
          readOnly: true
          title: Capacidad
        remaining_seats:
          type: integer
          readOnly: true
          description: 'Cupos libres: capacidad menos reservas confirmadas.'
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        modality:
          allOf:
          - $ref: '#/components/schemas/ModalityEnum'
          readOnly: true
        location:
          type: string
          readOnly: true
          title: Lugar o enlace
      required:
      - capacity
      - ends_at
      - id
      - location
      - modality
      - monitor
      - remaining_seats
      - starts_at
      - status
      - subject
      - template
      - term
    CatalogSummary:
      type: object
      properties:
        term:
          type: string
          nullable: true
          description: Código del período resumido.
        subjects_active:
          type: integer
        departments_active:
          type: integer
        courses:
          type: integer
        courses_without_teacher:
          type: integer
        courses_without_monitor:
          type: integer
        monitor_assignments:
          type: integer
        committed_hours_total:
          type: integer
      required:
      - committed_hours_total
      - courses
      - courses_without_monitor
      - courses_without_teacher
      - departments_active
      - monitor_assignments
      - subjects_active
      - term
    Course:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        subject:
          allOf:
          - $ref: '#/components/schemas/SubjectSummary'
          readOnly: true
        term:
          type: string
          title: Código
          readOnly: true
        group:
          type: string
          readOnly: true
          title: Grupo
        teacher:
          allOf:
          - $ref: '#/components/schemas/UserReference'
          readOnly: true
          nullable: true
        monitor_count:
          type: integer
          readOnly: true
