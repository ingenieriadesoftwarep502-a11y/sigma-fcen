      - status
    HistoryItem:
      type: object
      description: One closed reservation of the student (HU-12, CA-HU12-1).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        slot:
          allOf:
          - $ref: '#/components/schemas/ReservationSlot'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/HistoryItemStatusEnum'
          readOnly: true
        session:
          allOf:
          - $ref: '#/components/schemas/HistorySession'
          nullable: true
          readOnly: true
