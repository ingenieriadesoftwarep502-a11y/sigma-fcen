      - password
    Material:
      type: object
      description: A document carries its file data; a video, its YouTube id. The
        rest is null.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        subject:
          allOf:
          - $ref: '#/components/schemas/SubjectReference'
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/MaterialKindEnum'
          readOnly: true
        title:
          type: string
          readOnly: true
          title: Título
        description:
          type: string
          readOnly: true
          title: Descripción
        uploaded_by:
          allOf:
          - $ref: '#/components/schemas/MonitorReference'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Creado
        file_name:
          type: string
          nullable: true
          readOnly: true
        file_extension:
          type: string
          nullable: true
          readOnly: true
        content_type:
          type: string
          nullable: true
          readOnly: true
        size_bytes:
          type: integer
          readOnly: true
          nullable: true
          title: Tamaño
        youtube_id:
          type: string
          nullable: true
          readOnly: true
        can_delete:
          type: boolean
          description: 'Whether the person reading may remove it: the author or an
            administrator.'
          readOnly: true
      required:
      - can_delete
      - content_type
      - created_at
      - description
      - file_extension
      - file_name
      - id
      - kind
      - size_bytes
      - subject
      - title
      - uploaded_by
      - youtube_id
    MaterialCreate:
      type: object
      description: '`file` for a DOCUMENT (multipart), `video_url` for a VIDEO; the
        author is the session.'
      properties:
        subject_id:
          type: integer
          description: Id de la asignatura a la que se agrega el material.
        kind:
          $ref: '#/components/schemas/MaterialKindEnum'
        title:
          type: string
          maxLength: 150
        description:
          type: string
          maxLength: 1000
        file:
          type: string
          format: uri
          nullable: true
          description: 'Documento (DOCUMENT): cualquier formato salvo ejecutables.'
        video_url:
          type: string
          description: Enlace del video de YouTube (VIDEO).
          maxLength: 500
      required:
      - kind
      - subject_id
      - title
    MaterialKindEnum:
      enum:
      - DOCUMENT
      - VIDEO
      type: string
      description: |-
        * `DOCUMENT` - DOCUMENT
        * `VIDEO` - VIDEO
    ModalityEnum:
      enum:
      - IN_PERSON
      - VIRTUAL
      type: string
      description: |-
        * `IN_PERSON` - Presencial
        * `VIRTUAL` - Virtual
