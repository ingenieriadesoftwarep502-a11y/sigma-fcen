      - evaluation
      - id
      - session
      - slot
      - status
    HistoryItemStatusEnum:
      enum:
      - COMPLETED
      - NO_SHOW
      type: string
      description: |-
        * `COMPLETED` - COMPLETED
        * `NO_SHOW` - NO_SHOW
    HistorySession:
      type: object
      description: 'What a student keeps of a session in the history: no notes (RN-006.9).'
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        topics:
          type: array
          items:
            $ref: '#/components/schemas/Topic'
          readOnly: true
        duration_minutes:
          type: integer
          readOnly: true
          title: Duración en minutos
        recorded_at:
          type: string
          format: date-time
          readOnly: true
          title: Registrada
      required:
      - duration_minutes
      - id
      - recorded_at
      - topics
