openapi: 3.0.3
info:
  title: SIGMA-FCEN API
  version: 1.0.0
  description: API REST del sistema de gestion de monitorias academicas de la FCEN.
paths:
  /api/v1/auth/csrf/:
    get:
      operationId: auth_csrf_retrieve
      description: |-
        Hands out the CSRF token the frontend echoes in X-CSRFToken (ADR-007).

        The token travels in the body because the frontend may run on another host, where it
        cannot read the API's cookies; the csrftoken cookie itself stays HttpOnly.
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: Issues the access and refresh tokens as HttpOnly cookies (ADR-007).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '401':
          description: Invalid credentials
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: |-
        Revokes the refresh token and clears the token cookies.

        No authentication: an expired access cookie must not prevent revoking the refresh token.
      tags:
      - auth
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: Issues a new access cookie from the refresh cookie, even if the
        access token expired.
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          description: No response body
        '401':
          description: Missing or invalid session
  /api/v1/auth/register/:
    post:
      operationId: auth_register_create
      description: Public self-registration with an institutional email (HU-01).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/availability-slots/:
    post:
      operationId: availability_slots_create
      description: A monitor publishes a single slot on an assigned subject (CA-HU05-1,
        CA-HU05-5).
      tags:
      - availability-slots
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SlotCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SlotCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SlotCreate'
        required: true
      security:
      - cookieJWT: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilitySlot'
          description: ''
  /api/v1/availability-slots/{id}/:
    patch:
      operationId: availability_slots_partial_update
      description: The owner moves, edits or withdraws a slot; another monitor's slot
        is a 404.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - availability-slots
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedSlotUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedSlotUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedSlotUpdate'
      security:
      - cookieJWT: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilitySlot'
          description: ''
        '409':
          description: La franja tiene una reserva o ya no está disponible.
    delete:
      operationId: availability_slots_destroy
      description: The owner moves, edits or withdraws a slot; another monitor's slot
        is a 404.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - availability-slots
      security:
      - cookieJWT: []
      responses:
        '204':
          description: No response body
        '409':
          description: La franja tiene una reserva o ya no está disponible.
  /api/v1/availability-slots/mine/:
    get:
      operationId: availability_slots_mine_list
      description: The requesting monitor's own slots, every state, of one term (the
        current by default).
      parameters:
      - in: query
        name: date_from
        schema:
          type: string
          format: date
        description: Fecha local de Bogotá, incluida.
      - in: query
        name: date_to
        schema:
          type: string
          format: date
        description: Fecha local de Bogotá, incluida.
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          enum:
          - AVAILABLE
          - RESERVED
          - CANCELLED
          - EXPIRED
          type: string
          minLength: 1
        description: |-
          * `AVAILABLE` - AVAILABLE
          * `RESERVED` - RESERVED
          * `CANCELLED` - CANCELLED
          * `EXPIRED` - EXPIRED
      - in: query
        name: subject
        schema:
          type: integer
          minimum: 1
        description: Id de asignatura.
      - in: query
        name: term
        schema:
          type: string
          title: Código
        description: Código del período; por defecto, el actual.
      tags:
      - availability-slots
      security:
      - cookieJWT: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAvailabilitySlotList'
          description: ''
  /api/v1/availability-slots/search/:
    get:
      operationId: availability_slots_search_list
      description: Bookable slots for any authenticated user, with combinable filters
        (HU-02).
      parameters:
      - in: query
        name: date_from
        schema:
          type: string
          format: date
        description: Fecha local de Bogotá, incluida.
      - in: query
        name: date_to
        schema:
          type: string
          format: date
        description: Fecha local de Bogotá, incluida.
      - in: query
        name: modality
        schema:
          enum:
          - IN_PERSON
          - VIRTUAL
          type: string
          minLength: 1
        description: |-
          * `IN_PERSON` - Presencial
          * `VIRTUAL` - Virtual
      - in: query
        name: monitor
        schema:
          type: string
          format: uuid
        description: Id del monitor.
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      - in: query
        name: subject
        schema:
          type: integer
          minimum: 1
        description: Id de asignatura.
      - in: query
        name: term
        schema:
          type: string
          title: Código
        description: Código del período; por defecto, todos.
      tags:
      - availability-slots
      security:
      - cookieJWT: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAvailabilitySlotList'
          description: ''
  /api/v1/catalog/summary/:
    get:
      operationId: catalog_summary_retrieve
      description: Headline numbers of the catalog for one term (the current one by
        default).
      parameters:
      - in: query
        name: term
        schema:
          type: string
          title: Código
        description: Código del período; por defecto, el actual.
      tags:
      - catalog
      security:
      - cookieJWT: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogSummary'
          description: ''
  /api/v1/courses/:
    get:
      operationId: courses_list
      description: Courses of one term (the current one by default); administrators
        only (RF-024).
      parameters:
      - in: query
        name: department
        schema:
          type: string
          maxLength: 20
          minLength: 1
        description: Id o código del departamento.
      - in: query
        name: ordering
        schema:
          enum:
          - code
          - name
          - -monitor_count
          type: string
          default: name
          minLength: 1
        description: |-
          * `code` - code
          * `name` - name
          * `-monitor_count` - -monitor_count
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
          maxLength: 100
        description: Busca en código y nombre de la asignatura y en nombre y correo
          del docente.
      - in: query
        name: term
        schema:
          type: string
          title: Código
        description: Código del período; por defecto, el actual.
      - in: query
        name: without_monitors
        schema:
          type: boolean
      - in: query
        name: without_teacher
        schema:
          type: boolean
      tags:
      - courses
      security:
      - cookieJWT: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCourseList'
          description: ''
    post:
      operationId: courses_create
      description: Courses of one term (the current one by default); administrators
        only (RF-024).
      tags:
      - courses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CourseCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CourseCreate'
        required: true
      security:
      - cookieJWT: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
          description: ''
  /api/v1/courses/{id}/:
    get:
      operationId: courses_retrieve
      description: Administrators read a course and change its group or teacher. PUT
        is not offered.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - courses
      security:
      - cookieJWT: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
          description: ''
    patch:
      operationId: courses_partial_update
      description: Administrators read a course and change its group or teacher. PUT
        is not offered.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - courses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCourseUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCourseUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCourseUpdate'
      security:
      - cookieJWT: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
          description: ''
  /api/v1/courses/mine/:
    get:
      operationId: courses_mine_list
      description: The requesting teacher's own courses and their monitors (T-02.8,
        RN-009.1).
      parameters:
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      - in: query
        name: term
        schema:
          type: string
          title: Código
        description: Código del período; por defecto, el actual.
      tags:
      - courses
      security:
      - cookieJWT: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTeacherCourseList'
          description: ''
  /api/v1/departments/:
    get:
      operationId: departments_list
      description: Everyone reads active departments; administrators also see inactive
        ones and write.
      parameters:
      - in: query
        name: active
        schema:
          type: boolean
        description: Solo administradores.
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      tags:
      - departments
      security:
      - cookieJWT: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDepartmentList'
          description: ''
    post:
      operationId: departments_create
      description: Everyone reads active departments; administrators also see inactive
        ones and write.
      tags:
      - departments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Department'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Department'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Department'
        required: true
      security:
      - cookieJWT: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
          description: ''
  /api/v1/departments/{id}/:
    get:
      operationId: departments_retrieve
      description: Read one department; administrators edit it. PUT is not offered.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - departments
      security:
      - cookieJWT: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
          description: ''
    patch:
      operationId: departments_partial_update
      description: Read one department; administrators edit it. PUT is not offered.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - departments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedDepartment'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedDepartment'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedDepartment'
      security:
      - cookieJWT: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
          description: ''
  /api/v1/health/:
    get:
      operationId: health_retrieve
      description: Reports service liveness and database connectivity. No authentication
        required.
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/v1/materials/:
    get:
      operationId: materials_list
      description: The repository of a subject (CA-HU08-4) and the upload into it
        (CA-HU08-1).
      parameters:
      - in: query
        name: kind
        schema:
          enum:
          - DOCUMENT
          - VIDEO
          type: string
          minLength: 1
        description: |-
          * `DOCUMENT` - DOCUMENT
          * `VIDEO` - VIDEO
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      - in: query
        name: subject
        schema:
          type: integer
        description: Id de la asignatura.
        required: true
      tags:
      - materials
      security:
      - cookieJWT: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMaterialList'
          description: ''
    post:
      operationId: materials_create
      description: The repository of a subject (CA-HU08-4) and the upload into it
        (CA-HU08-1).
      tags:
      - materials
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MaterialCreate'
          application/json:
            schema:
              $ref: '#/components/schemas/MaterialCreate'
        required: true
      security:
      - cookieJWT: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Material'
          description: ''
        '400':
          description: Error en el formato de SAD §6.3 (type, title, detail…).
        '403':
          description: Error en el formato de SAD §6.3 (type, title, detail…).
        '413':
          description: Error en el formato de SAD §6.3 (type, title, detail…).
  /api/v1/materials/{id}/:
    delete:
      operationId: materials_destroy
      description: The author or an administrator removes material; it only stops
        being listed.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - materials
      security:
      - cookieJWT: []
      responses:
        '204':
          description: No response body
        '403':
          description: Error en el formato de SAD §6.3 (type, title, detail…).
        '404':
          description: Error en el formato de SAD §6.3 (type, title, detail…).
  /api/v1/materials/{id}/download/:
    get:
      operationId: materials_download_retrieve
      description: A document, for anyone signed in (CA-HU08-4, RNF-SEC-003). Videos
        play from YouTube.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - materials
      security:
      - cookieJWT: []
      responses:
        '200':
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          description: ''
        '401':
          description: Error en el formato de SAD §6.3 (type, title, detail…).
        '404':
          description: Error en el formato de SAD §6.3 (type, title, detail…).
  /api/v1/materials/subjects/:
    get:
      operationId: materials_subjects_list
      description: Where the signed-in user may add material, with what each subject
        already holds.
      tags:
      - materials
      security:
      - cookieJWT: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UploadableSubject'
          description: ''
  /api/v1/monitor-assignments/:
    get:
      operationId: monitor_assignments_list
      description: Monitor assignments of one term; administrators authorize monitors
        (RF-023).
      parameters:
      - in: query
        name: monitor
        schema:
          type: string
          format: uuid
        description: Id del monitor.
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
          maxLength: 100
        description: Busca en nombre y correo del monitor y en código y nombre de
          la asignatura.
      - in: query
        name: subject
        schema:
          type: integer
          minimum: 1
        description: Id de asignatura.
      - in: query
        name: term
        schema:
          type: string
          title: Código
        description: Código del período; por defecto, el actual.
      tags:
      - monitor-assignments
      security:
      - cookieJWT: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMonitorAssignmentList'
          description: ''
    post:
      operationId: monitor_assignments_create
      description: Monitor assignments of one term; administrators authorize monitors
        (RF-023).
      tags:
      - monitor-assignments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MonitorAssignmentCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MonitorAssignmentCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MonitorAssignmentCreate'
        required: true
      security:
      - cookieJWT: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitorAssignment'
          description: ''
  /api/v1/monitor-assignments/{id}/:
    delete:
      operationId: monitor_assignments_destroy
      description: Administrators withdraw a monitor's authorization.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - monitor-assignments
      security:
      - cookieJWT: []
      responses:
        '204':
          description: No response body
  /api/v1/monitor-assignments/mine/:
    get:
      operationId: monitor_assignments_mine_list
      description: The requesting monitor's own assignments and their subjects' teachers
        (RN-009.1).
      parameters:
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      - in: query
        name: term
        schema:
          type: string
          title: Código
        description: Código del período; por defecto, el actual.
      tags:
      - monitor-assignments
      security:
      - cookieJWT: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMonitorOwnAssignmentList'
          description: ''
  /api/v1/reservations/:
    post:
      operationId: reservations_create
      description: A student books a seat in a slot (HU-03, CA-HU03-1 to CA-HU03-6).
      tags:
      - reservations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReservationCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReservationCreate'
        required: true
      security:
      - cookieJWT: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
          description: ''
        '400':
          description: Error en el formato de SAD §6.3 (type, title, detail…).
        '403':
          description: Error en el formato de SAD §6.3 (type, title, detail…).
