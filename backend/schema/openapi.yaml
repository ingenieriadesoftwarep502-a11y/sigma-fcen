        id:
          type: string
          format: uuid
          readOnly: true
        slot:
          allOf:
          - $ref: '#/components/schemas/ReservationSlot'
          readOnly: true
        student:
          allOf:
          - $ref: '#/components/schemas/MonitorReference'
          readOnly: true
