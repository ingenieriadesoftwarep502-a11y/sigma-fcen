[mypy]
python_version = 3.11
strict = True
exclude = (?x)(^\.venv/|/migrations/)
plugins = mypy_django_plugin.main, mypy_drf_plugin.main

[mypy.plugins.django-stubs]
django_settings_module = mi_proyecto.settings.test

[mypy-environ.*]
ignore_missing_imports = True

[mypy-factory.*]
ignore_missing_imports = True
